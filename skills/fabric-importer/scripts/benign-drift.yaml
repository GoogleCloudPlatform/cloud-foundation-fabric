# HUMAN-OWNED benign-drift ruleset for verify_plan.py.
#
# Every entry declares a class of plan diffs that is a provider/schema
# artifact rather than real config-vs-reality drift. Entries require:
#   - resource:        terraform resource type ("*" for any)
#   - attributes:      top-level attribute paths covered
#   - reason:          human-reviewed justification
#   - verified_against: provider (and optionally terraform) version the
#     justification was checked on. Re-verify on provider major bumps.
#   - a bound on the DIFF (machine-enforced; an unbounded rule is
#     ignored with a warning when it would otherwise have applied):
#       when_after: {attr: value}          exact destination value
#       when_after_matches: {attr: regex}  destination matches, one line
#       when_after_computed: [attr, ...]   destination is FULLY unknown at
#         or true                          plan time (provider-computed)
#       when_unchanged: [attr, ...]        these attributes must not
#                                          appear in the diff at all
#     Every attribute in `attributes` needs a direct destination guard,
#     OR the rule declares `when_unchanged` naming the live-affecting
#     siblings that make the diff inert (the `terraform_labels` case:
#     provider bookkeeping is harmless exactly while `labels` and
#     `effective_labels` are untouched). `when_unchanged` must be
#     disjoint from `attributes`.
#     `when_before` alone is NOT sufficient. A rule that bounds only the
#     live value accepts an arbitrary destination, so the gate would
#     report CONVERGED for a plan that really writes to the resource on
#     apply — the exact silent-pass this ruleset exists to prevent.
#   Only the diff bound is machine-enforced; `reason` and
#   `verified_against` are conventions a human reviewer upholds.
#
# Keep `attributes` as narrow as possible: changed paths are reported as
# TOP-LEVEL keys, so listing a block attribute waives every future change
# anywhere under it.
#
# The model operating the skill MUST NOT edit this file. verify_plan.py
# prints a proposal template for unmatched updates; a human reviews the
# diff and commits the entry.

rules:
  - resource: google_folder
    attributes: [timeouts]
    when_before:
      timeouts: {}
    when_after:
      timeouts: null
    reason: >-
      Google provider v7 emits `timeouts {} -> null` in the import preview
      for imported folders; the attribute is not a live setting and
      disappears once state is persisted.
    verified_against:
      provider: 7.45.0
      status: verified

  - resource: google_logging_organization_sink
    attributes: [description]
    # Guard: only sinks whose LIVE description is the empty string are
    # covered; a real description drift on a sink must stay residual.
    when_before:
      description: ""
    # Guard: the destination must be the module default, which
    # modules/organization/logging.tf builds as
    # `coalesce(each.value.description, "${each.key} (Terraform-managed).")`.
    # Any other new description is real drift and stays residual.
    when_after_matches:
      description: '[^\n]{1,96} \(Terraform-managed\)\.'
    reason: >-
      Live GCP log sinks with empty description ("") cannot round-trip through
      Fabric's coalesce(v.description, default) which treats empty string as null
      and applies the default description.
    verified_against:
      provider: 7.45.0
      status: verified

  - resource: google_compute_subnetwork
    attributes: [send_secondary_ip_range_if_empty]
    when_before:
      send_secondary_ip_range_if_empty: null
    when_after:
      send_secondary_ip_range_if_empty: true
    reason: >-
      Fabric modules/net-vpc hardcodes send_secondary_ip_range_if_empty = true
      on google_compute_subnetwork to ensure secondary range removals propagate,
      which causes an in-place preview diff (null -> true) on imported subnets.
    verified_against:
      provider: 7.45.0
      status: verified

  - resource: "*"
    attributes: [terraform_labels]
    when_before:
      terraform_labels: {}
    # Guard: terraform_labels is provider bookkeeping, harmless exactly
    # while the attributes that really carry labels to the API are
    # untouched. If `labels` or `effective_labels` move too, this is a
    # real label write and stays residual.
    when_unchanged: [labels, effective_labels]
    reason: >-
      Google provider v7 computes `terraform_labels: {} -> {...}` during import
      preview when default/inherited provider labels exist while
      effective_labels and labels match live state with zero underlying mutation.
    verified_against:
      provider: 7.45.0
      status: verified
