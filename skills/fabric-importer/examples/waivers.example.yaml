# HUMAN-OWNED waiver ledger (example).
#
# A waiver excludes one in-scope inventory key from the coverage gate:
# "we saw it, we decided not to manage it, here is why, signed". The model
# operating the skill MUST NOT add or edit waivers; it may only propose
# them in its report for a human to review and commit.
#
# Every waiver requires key + reason. `signed_by` records who accepted
# it — coverage.py reports waivers without it, and hard-fails them under
# --require-signed-waivers (recommended whenever a human is in the
# loop). Include the date in the signed_by value for auditing.

waivers:
  - key: //cloudresourcemanager.googleapis.com/folders/000000000001
    reason: >-
      Decommissioning next quarter; not worth importing. Tracked in
      TICKET-123.
    signed_by: alice@example.com 2026-08-21

  - key: //logging.googleapis.com/organizations/000000000000/sinks/tmp-debug
    reason: temporary debugging sink owned by the SRE oncall; do not manage
    signed_by: bob@example.com 2026-08-21
