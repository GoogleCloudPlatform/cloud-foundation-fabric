# yaml-language-server: $schema=../../../../schemas/custom-constraint.schema.json

# Denied prefixes match both short (2.0, 2.0-debian10) and full (2.0.160-debian10)
# image version formats. Update them as image versions reach end of support, see
# https://cloud.google.com/dataproc/docs/concepts/versioning/dataproc-version-clusters

custom.dataprocAllowedImageVersions:
  action_type: DENY
  condition: |-
    has(resource.config.softwareConfig.imageVersion) && (
      resource.config.softwareConfig.imageVersion.startsWith('1.') ||
      resource.config.softwareConfig.imageVersion.startsWith('2.0') ||
      resource.config.softwareConfig.imageVersion.startsWith('2.1')
    )
  description: Ensure Dataproc clusters do not use unsupported image versions (1.x,
    2.0, 2.1)
  display_name: Require Dataproc clusters to use supported image versions
  method_types:
  - CREATE
  - UPDATE
  resource_types:
  - dataproc.googleapis.com/Cluster
