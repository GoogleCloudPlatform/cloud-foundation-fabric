# yaml-language-server: $schema=../../../../schemas/custom-constraint.schema.json

custom.loggingRequireLogBucketRetention90Days:
  action_type: DENY
  condition: |-
    resource.retentionDays < 90
  description: Ensure Cloud Logging log buckets are configured with a retention period of at least 90 days
  display_name: Require at least 90 days retention on Cloud Logging log buckets
  method_types:
  - CREATE
  - UPDATE
  resource_types:
  - logging.googleapis.com/LogBucket
