# yaml-language-server: $schema=../../../../schemas/custom-constraint.schema.json

custom.cloudsqlDisablePostgreSQLLogStatementStatsFlag:
  action_type: DENY
  condition: |-
    resource.databaseVersion.startsWith('POSTGRES') &&
    resource.settings.databaseFlags.exists(f, f.name == 'log_statement_stats' && f.value != 'off')
  description: Ensure Cloud SQL for PostgreSQL instances do not enable the log_statement_stats database flag
  display_name: Disable log_statement_stats flag for Cloud SQL PostgreSQL instances
  method_types:
  - CREATE
  - UPDATE
  resource_types:
  - sqladmin.googleapis.com/Instance
