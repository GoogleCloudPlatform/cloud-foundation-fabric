# yaml-language-server: $schema=../../../../schemas/custom-constraint.schema.json

custom.iamLimitKmsCryptoKeyUsers:
  action_type: DENY
  condition: |-
    resource.bindings.exists(binding,
      RoleNameMatches(binding.role, [
        'roles/cloudkms.cryptoKeyEncrypterDecrypter',
        'roles/cloudkms.cryptoKeyEncrypter',
        'roles/cloudkms.cryptoKeyDecrypter',
        'roles/cloudkms.signer',
        'roles/cloudkms.signerVerifier'
      ]) &&
      binding.members.size() > 3
    )
  description: Ensure IAM policy updates for Cloud KMS crypto key roles do not
    grant more than 3 principals in a single binding change
  display_name: Limit Cloud KMS crypto key role bindings to at most 3 principals
    per policy change
  method_types:
  - CREATE
  - UPDATE
  resource_types:
  - iam.googleapis.com/AllowPolicy
