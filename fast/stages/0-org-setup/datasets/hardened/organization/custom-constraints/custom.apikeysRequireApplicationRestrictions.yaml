# yaml-language-server: $schema=../../../../schemas/custom-constraint.schema.json

custom.apikeysRequireApplicationRestrictions:
  action_type: DENY
  condition: |-
    !has(resource.restrictions) || !(
      (has(resource.restrictions.androidKeyRestrictions) &&
        resource.restrictions.androidKeyRestrictions.allowedApplications.size() > 0) ||
      (has(resource.restrictions.iosKeyRestrictions) &&
        resource.restrictions.iosKeyRestrictions.allowedBundleIds.size() > 0) ||
      (has(resource.restrictions.browserKeyRestrictions) &&
        resource.restrictions.browserKeyRestrictions.allowedReferrers.size() > 0 &&
        resource.restrictions.browserKeyRestrictions.allowedReferrers.all(r,
          !r.matches('^\\*(?:\\.[a-zA-Z]+(?:/\\*)?)?$')
        )) ||
      (has(resource.restrictions.serverKeyRestrictions) &&
        resource.restrictions.serverKeyRestrictions.allowedIps.size() > 0 &&
        resource.restrictions.serverKeyRestrictions.allowedIps.all(ip,
          !ip.matches('^[./:0]+$')
        ))
    )
  description: Ensure API keys configure application restrictions without broad wildcards or 0.0.0.0/0
  display_name: Require application restrictions on API keys
  method_types:
  - CREATE
  - UPDATE
  resource_types:
  - apikeys.googleapis.com/Key
