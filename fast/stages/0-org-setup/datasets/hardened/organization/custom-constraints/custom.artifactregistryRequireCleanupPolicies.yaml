# yaml-language-server: $schema=../../../../schemas/custom-constraint.schema.json

custom.artifactregistryRequireCleanupPolicies:
  action_type: ALLOW
  condition: |-
    resource.cleanupPolicies.size() > 0 &&
    resource.cleanupPolicyDryRun == false
  description: Ensure that Artifact Registry repositories define at least one
    cleanup policy with dry-run disabled
  display_name: Require Artifact Registry repositories to configure active
    cleanup policies
  method_types:
  - CREATE
  - UPDATE
  resource_types:
  - artifactregistry.googleapis.com/Repository
