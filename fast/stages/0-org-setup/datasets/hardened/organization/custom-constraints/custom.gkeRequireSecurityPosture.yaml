# yaml-language-server: $schema=../../../../schemas/custom-constraint.schema.json

custom.gkeRequireSecurityPosture:
  action_type: DENY
  condition: |-
    !has(resource.securityPostureConfig) ||
    !(resource.securityPostureConfig.mode in ['BASIC', 'ENTERPRISE'])
  description: Ensure GKE clusters have Security Posture mode set to BASIC or ENTERPRISE
  display_name: Require Security Posture enabled on GKE clusters
  method_types:
  - CREATE
  - UPDATE
  resource_types:
  - container.googleapis.com/Cluster
