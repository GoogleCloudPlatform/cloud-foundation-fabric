# yaml-language-server: $schema=../../../../schemas/custom-constraint.schema.json

custom.discoveryengineDisableNonGcpDataStores:
  action_type: ALLOW
  condition: |-
    resource.contentConfig in [
      '',
      'CONTENT_CONFIG_UNSPECIFIED',
      'NO_CONTENT',
      'CONTENT_REQUIRED'
    ]
  description: Ensure Vertex AI Agent Builder (Discovery Engine) data stores
    only use standard GCP content configurations (NO_CONTENT or CONTENT_REQUIRED)
  display_name: Restrict Discovery Engine data stores to GCP content configurations
  method_types:
  - CREATE
  - UPDATE
  resource_types:
  - discoveryengine.googleapis.com/DataStore
