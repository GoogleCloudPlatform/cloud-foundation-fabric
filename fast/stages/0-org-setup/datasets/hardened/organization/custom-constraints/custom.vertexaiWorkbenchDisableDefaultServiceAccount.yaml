# yaml-language-server: $schema=../../../../schemas/custom-constraint.schema.json

custom.vertexaiWorkbenchDisableDefaultServiceAccount:
  action_type: DENY
  condition: |-
    !has(resource.gceSetup) ||
    !has(resource.gceSetup.serviceAccounts) ||
    resource.gceSetup.serviceAccounts.size() == 0 ||
    resource.gceSetup.serviceAccounts.exists(
      sa,
      sa.email == '' ||
      sa.email == 'default' ||
      sa.email.endsWith('-compute@developer.gserviceaccount.com')
    )
  description: Prevent Vertex AI Workbench instances from using the default
    Compute Engine service account
  display_name: Disable default service account on Vertex AI Workbench instances
  method_types:
  - CREATE
  - UPDATE
  resource_types:
  - notebooks.googleapis.com/Instance
