# yaml-language-server: $schema=../../../../schemas/custom-constraint.schema.json

custom.iamRestrictFirestoreServiceAccountAccess:
  action_type: DENY
  condition: |-
    resource.bindings.exists(binding,
      RoleNameContains(binding.role, ['firestore', 'datastore']) &&
      binding.members.exists(member,
        MemberSubjectStartsWith(member, ['serviceAccount:']) &&
        !MemberSubjectEndsWith(member, ['@gcp-sa-firestore.iam.gserviceaccount.com'])
      )
    )
  description: Ensure IAM roles containing firestore or datastore are not
    granted to service accounts other than the Firestore service agent
  display_name: Restrict Firestore and Datastore roles on service accounts to the Firestore service agent
  method_types:
  - CREATE
  - UPDATE
  resource_types:
  - iam.googleapis.com/AllowPolicy
