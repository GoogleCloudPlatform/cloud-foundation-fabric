# yaml-language-server: $schema=../../../../schemas/custom-constraint.schema.json

custom.storageRequireRetentionOrSoftDelete:
  action_type: DENY
  condition: |-
    has(resource.softDeletePolicy) &&
    resource.softDeletePolicy.retentionDurationSeconds <= 0 &&
    !(
      has(resource.versioning) &&
      resource.versioning.enabled &&
      has(resource.objectRetention) &&
      resource.objectRetention.mode == 'Enabled'
    )
  description: Ensure Cloud Storage buckets have a non-zero soft delete policy
    or both object versioning and object retention enabled
  display_name: Require soft delete policy or object versioning with object retention on Cloud Storage buckets
  method_types:
  - CREATE
  - UPDATE
  resource_types:
  - storage.googleapis.com/Bucket
