# yaml-language-server: $schema=../../../../schemas/custom-constraint.schema.json

custom.cloudArmorRequireCveCanaryRule:
  action_type: DENY
  condition: |-
    (resource.type == '' || resource.type == 'CLOUD_ARMOR') &&
    !resource.rules.exists(rule,
      has(rule.match) && (
        rule.match.versionedExpr == 'cve-canary' ||
        (has(rule.match.expr) && rule.match.expr.expression.contains('cve-canary'))
      )
    )
  description: Ensure Cloud Armor backend security policies include a rule evaluating the cve-canary WAF expression
  display_name: Require cve-canary WAF rule in Cloud Armor security policies
  method_types:
  - CREATE
  - UPDATE
  resource_types:
  - compute.googleapis.com/SecurityPolicy
