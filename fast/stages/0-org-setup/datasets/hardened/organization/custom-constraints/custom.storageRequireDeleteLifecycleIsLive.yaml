# yaml-language-server: $schema=../../../../schemas/custom-constraint.schema.json

custom.storageRequireDeleteLifecycleIsLive:
  action_type: ALLOW
  condition: |-
    has(resource.lifecycle) &&
    resource.lifecycle.rule.exists(
      r,
      r.action.type == 'Delete' && r.condition.isLive == true
    )
  description: Ensure that Cloud Storage buckets configure a lifecycle Delete
    rule with isLive set to true
  display_name: Require Cloud Storage buckets to have a Delete lifecycle rule
    with isLive enabled
  method_types:
  - CREATE
  - UPDATE
  resource_types:
  - storage.googleapis.com/Bucket
