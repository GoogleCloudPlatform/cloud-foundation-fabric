# yaml-language-server: $schema=../../../../schemas/custom-constraint.schema.json

custom.cloudkmsAllowedPurpose:
  action_type: DENY
  condition: |-
    has(resource.purpose) &&
    !(resource.purpose in ['ENCRYPT_DECRYPT', 'ASYMMETRIC_SIGN', 'ASYMMETRIC_DECRYPT'])
  description: Ensure the purpose for Cloud KMS keys is configured for approved
    encryption or signing operations
  display_name: Restrict Cloud KMS keys to approved purposes
  method_types:
  - CREATE
  resource_types:
  - cloudkms.googleapis.com/CryptoKey
