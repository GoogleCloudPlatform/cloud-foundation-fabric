# yaml-language-server: $schema=../../../../schemas/custom-constraint.schema.json

custom.storageRequireOwnerLabel:
  action_type: ALLOW
  condition: |-
    'owner' in resource.labels &&
    resource.labels['owner'] != ''
  description: Ensure that Cloud Storage buckets define a non-empty owner label
  display_name: Require Cloud Storage buckets to have a non-empty owner label
  method_types:
  - CREATE
  - UPDATE
  resource_types:
  - storage.googleapis.com/Bucket
