# yaml-language-server: $schema=../../../../schemas/custom-constraint.schema.json

custom.storageRequireBucketRetentionPolicy:
  action_type: DENY
  condition: |-
    !has(resource.retentionPolicy) ||
    !has(resource.retentionPolicy.retentionPeriod) ||
    int(resource.retentionPolicy.retentionPeriod) < 7776000
  description: Enforce that Cloud Storage buckets have a retention policy of at
    least 90 days configured
  display_name: Require retention policy on Cloud Storage buckets
  method_types:
  - CREATE
  - UPDATE
  resource_types:
  - storage.googleapis.com/Bucket
