# yaml-language-server: $schema=../../../../schemas/custom-constraint.schema.json

custom.storageRequireRegionalLocation:
  action_type: DENY
  condition: |-
    (has(resource.customPlacementConfig) && resource.customPlacementConfig.dataLocations.size() > 0) ||
    !resource.location.matches('^[a-zA-Z]+-[a-zA-Z]+[0-9]+$')
  description: Ensure Cloud Storage buckets are deployed in a single region
    rather than multi-region or dual-region locations
  display_name: Require regional deployment for Cloud Storage buckets
  method_types:
  - CREATE
  - UPDATE
  resource_types:
  - storage.googleapis.com/Bucket
