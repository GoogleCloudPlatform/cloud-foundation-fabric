---
# sample subset of useful organization policies, edit to suit requirements
# start of document (---) avoids errors if the file only contains comments

# yaml-language-server: $schema=../../../../schemas/org-policies.schema.json

# compute.disableGlobalCloudArmorPolicy:
#   rules:
#     - enforce: true

# compute.disableGlobalLoadBalancing:
#   rules:
#     - enforce: true

# compute.disableGlobalSelfManagedSslCertificate:
#   rules:
#     - enforce: true

compute.disableInternetNetworkEndpointGroup:
  rules:
    - enforce: true

compute.disableSshInBrowser:
  rules:
    - enforce: true

compute.disableVpcExternalIpv6:
  rules:
    - enforce: true

compute.managed.blockPreviewFeatures:
  rules:
    - enforce: true

compute.managed.disableGuestAttributesAccess:
  rules:
    - enforce: true

compute.managed.disableNestedVirtualization:
  rules:
    - enforce: true

# compute.managed.disableNonFIPSMachineTypes:
#   rules:
#     - enforce: true

compute.managed.disableSerialPortAccess:
  rules:
    - enforce: true

compute.managed.disableSerialPortLogging:
  rules:
    - enforce: true

compute.managed.requireOsConfig:
  rules:
    - enforce: true

compute.managed.requireOsLogin:
  rules:
    - enforce: true

# compute.managed.restrictNonConfidentialComputing:
#   rules:
#     - enforce: true

compute.managed.restrictProtocolForwardingCreationForTypes:
  rules:
    - enforce: true
      parameters: |
        {
          "allowedSchemes": [
            "INTERNAL"
          ]
        }

compute.managed.vmCanIpForward:
  rules:
    - enforce: true

compute.managed.vmExternalIpAccess:
  rules:
    - enforce: true

compute.requireShieldedVm:
  rules:
    - enforce: true

compute.requireSslPolicy:
  rules:
    - allow:
        values:
          - "under:organizations/${organization.id}"

compute.restrictLoadBalancerCreationForTypes:
  rules:
    - allow:
        values:
          - "in:INTERNAL"

compute.setNewProjectDefaultToZonalDNSOnly:
  rules:
    - enforce: true

compute.skipDefaultNetworkCreation:
  rules:
    - enforce: true

compute.trustedImageProjects:
  rules:
    - allow:
        values:
          - "is:projects/centos-cloud"
          - "is:projects/cos-cloud"
          - "is:projects/debian-cloud"
          - "is:projects/fedora-cloud"
          - "is:projects/fedora-coreos-cloud"
          - "is:projects/opensuse-cloud"
          - "is:projects/rhel-cloud"
          - "is:projects/rhel-sap-cloud"
          - "is:projects/rocky-linux-cloud"
          - "is:projects/suse-cloud"
          - "is:projects/suse-sap-cloud"
          - "is:projects/ubuntu-os-cloud"
          - "is:projects/ubuntu-os-pro-cloud"
          - "is:projects/windows-cloud"
          - "is:projects/windows-sql-cloud"
          - "is:projects/confidential-vm-images"
          - "is:projects/confidential-space-images"
          - "is:projects/backupdr-images"
          - "is:projects/deeplearning-platform-release"
          - "is:projects/serverless-vpc-access-images"
          - "is:projects/gke-node-images"
          - "is:projects/gke-windows-node-images"
          - "is:projects/ubuntu-os-gke-cloud"
          - "is:projects/rocky-linux-accelerator-cloud"
          - "is:projects/ubuntu-os-accelerator-images"

