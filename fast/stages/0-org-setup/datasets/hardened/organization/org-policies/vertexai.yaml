---
# sample subset of useful organization policies, edit to suit requirements
# start of document (---) avoids errors if the file only contains comments

# yaml-language-server: $schema=../../../../schemas/org-policies.schema.json

ainotebooks.accessMode:
  rules:
    - allow:
        values:
          - "service-account"

ainotebooks.disableFileDownloads:
  rules:
    - enforce: true

ainotebooks.disableRootAccess:
  rules:
    - enforce: true

ainotebooks.disableTerminal:
  rules:
    - enforce: true

# ainotebooks.environmentOptions:
#   rules:
#     - allow:
#         values:
#           - "ainotebooks-container/gcr.io/deeplearning-platform-release/workbench-container:latest"

ainotebooks.requireAutoUpgradeSchedule:
  rules:
    - enforce: true

ainotebooks.restrictPublicIp:
  rules:
    - enforce: true

ainotebooks.restrictVpcNetworks:
  rules:
    - allow:
        values:
          - "under:organizations/${organization.id}"

custom.discoveryengineDisableNonGcpDataStores:
  rules:
    - enforce: true

custom.vertexaiRuntimeTemplateDisableInternetAccess:
  rules:
    - enforce: true

custom.vertexaiRuntimeTemplateRequireIdleShutdown:
  rules:
    - enforce: true

custom.vertexaiRuntimeTemplateRequireSecureBoot:
  rules:
    - enforce: true

custom.vertexaiWorkbenchDisableDefaultServiceAccount:
  rules:
    - enforce: true

custom.vertexaiWorkbenchRequireAutoUpgrade:
  rules:
    - enforce: true

custom.vertexaiWorkbenchRequireDeleteToTrash:
  rules:
    - enforce: true

custom.vertexaiWorkbenchRequireIntegrityMonitoring:
  rules:
    - enforce: true

custom.vertexaiWorkbenchRequireSecureBoot:
  rules:
    - enforce: true

custom.vertexaiWorkbenchRequireVtpm:
  rules:
    - enforce: true

# vertexai.allowOnlyAllCompliantAPIs:
#   rules:
#     - enforce: true

# vertexai.allowOnlyIL5CompliantAPIs:
#   rules:
#     - enforce: true

# vertexai.allowOnlyITARCompliantAPIs:
#   rules:
#     - enforce: true

vertexai.configurableComputerUseToolSafetyPolicies:
  rules:
    - deny:
        all: true
