---
# sample subset of useful organization policies, edit to suit requirements
# start of document (---) avoids errors if the file only contains comments

# yaml-language-server: $schema=../../../../schemas/org-policies.schema.json

custom.iamDisableAdminServiceAccount:
  rules:
    - enforce: true

custom.iamDisableBasicRoles:
  rules:
    - enforce: true

custom.iamDisableProjectServiceAccountImpersonationRoles:
  rules:
    - enforce: false
      condition:
        title: Allow service account impersonation for tagged users
        expression: |
          resource.matchTag('${organization.id}/org-policies', 'allowed-sa-impersonation')
    - enforce: true

custom.iamDisableRedisAdminRoles:
  rules:
    - enforce: false

# custom.iamLimitKmsCryptoKeyUsers:
#   rules:
#     - enforce: true

# custom.iamRestrictFirestoreServiceAccountAccess:
#   rules:
#     - enforce: true

iam.automaticIamGrantsForDefaultServiceAccounts:
  rules:
    - enforce: true

iam.disableAuditLoggingExemption:
  rules:
    - enforce: true

iam.managed.allowedPolicyMembers:
  rules:
    - enforce: false
      condition:
        title: Allow any member domain
        expression: |
          resource.matchTag('${organization.id}/org-policies', 'allowed-policy-member-domains-all')
    - enforce: true
      parameters: |
        {
          "allowedMemberSubjects": [
            "${iam_principals.gcp-organization-admins}"
          ],
          "allowedPrincipalSets": [
            "//cloudresourcemanager.googleapis.com/organizations/${organization.id}"
          ]
        }

iam.managed.disableServiceAccountApiKeyCreation:
  rules:
    - enforce: true

iam.managed.disableServiceAccountKeyCreation:
  rules:
    - enforce: true

iam.managed.disableServiceAccountKeyUpload:
  rules:
    - enforce: true

iam.managed.preventPrivilegedBasicRolesForDefaultServiceAccounts:
  rules:
    - enforce: true

iam.managed.workloadIdentityPoolProviders:
  rules:
    - enforce: true

iam.serviceAccountKeyExposureResponse:
  rules:
    - allow:
        values:
          - "is:DISABLE_KEY"

iam.workloadIdentityPoolAwsAccounts:
  rules:
    - deny:
        all: true
