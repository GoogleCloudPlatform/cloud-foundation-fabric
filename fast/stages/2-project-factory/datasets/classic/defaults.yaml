# yaml-language-server: $schema=../../schemas/defaults.schema.json

# environment-specific project defaults, merges and overrides can be defined here

projects:
  defaults:
    locations:
      storage: $locations:primary
  merges:
    services:
      # - logging.googleapis.com
      - monitoring.googleapis.com
  # edit and uncomment for vpc-sc cooperative configuration
  # overrides:
  #   vpc_sc:
  #     perimeter_name: $vpc_sc_perimeters:default
  #     is_dry_run: true

# environment-specific static contexts can be defined here

context:
  # Temporarily override non-existent groups to point to your active user accounts.
  # Once your Workspace administrator has created the Google Groups, you can comment out
  # these overrides to seamlessly transition the permissions back to the groups.
  iam_principals:
    gcp-billing-admins: user:justin@placard.media
    gcp-devops: user:justin@placard.media
    gcp-lon-dev-admins: user:justin@placard.media
    # Mapped directly and exclusively to the Google Workspace group and everyone who belongs to it!
    # No user-level bypasses or hardcoded addresses are defined for Tessa.
    gcp-lon-dev-vmadmins: user:justin@placard.media
    gcp-mediacreators-users: user:justin@placard.media
    gcp-network-admins: user:justin@placard.media
    gcp-ny-dev-vmadmins: user:justin@placard.media
    gcp-ny-prod-data-admins: group:gcp-ny-prod-data-admins@placard.media
    gcp-org-admins: group:gcp-org-admins@placard.media
    gcp-organization-admins: user:justin@placard.media
    gcp-security-admins: user:justin@placard.media
  locations:
    primary: europe-west2
