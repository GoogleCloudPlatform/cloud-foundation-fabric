# yaml-language-server: $schema=../../../schemas/project.schema.json

name: lon-dev-project-0
parent: $folder_ids:naeu-department/lon-team/lon-nonprod/dev-project

# Enable Compute and network APIs
services:
  - compute.googleapis.com
  - iap.googleapis.com
  - logging.googleapis.com
  - monitoring.googleapis.com

# Connect this project as a Service Project to your Shared VPC host project (net-dev-0)
# Note: The network_users list does not support context-interpolation in the project module,
# so we declare your active user account directly to authorize the Shared VPC network connection.
shared_vpc_service_config:
  host_project: $project_ids:net-dev-0
  network_users:
    - user:justin@placard.media

# Custom IAM Roles created specifically inside this project
custom_roles:
  lon_dev_vm_viewer:
    title: "London Dev VM Viewer"
    description: "Grants specific permissions to retrieve details of compute instances."
    permissions:
      - compute.instances.get

# Project-Level IAM Permissions
#
#----------------------------------------------------------------------------
# Principal-based mappings declared under iam_by_principals (conforms to schema)
iam_by_principals:
  # Bind your London developers group context key to the GCE/IAP access roles
  # This resolves dynamically to Tessa Bloggs (user:tessa.bloggs@placard.media)
  # via the Stage 2 context-merging logic!
  "$iam_principals:gcp-lon-dev-vmadmins":
    - roles/compute.instanceAdmin.v1
    - roles/compute.osLogin
    - roles/iap.tunnelResourceAccessor
    - $custom_roles:lon_dev_vm_viewer
