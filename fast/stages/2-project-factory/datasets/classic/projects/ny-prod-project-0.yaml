# yaml-language-server: $schema=../../../schemas/project.schema.json

name: ny-prod-project-0
parent: $folder_ids:naeu-department/ny-team/ny-prod

# Enable BigQuery and basic APIs
services:
  - bigquery.googleapis.com

# Connect this project as a Service Project to your Shared VPC host project (net-prod-0)
# Note: The network_users list does not support context-interpolation in the project module,
# so we declare your active user account directly to authorize the Shared VPC network connection.
shared_vpc_service_config:
  host_project: $project_ids:net-prod-0
  network_users:
    - user:justin@placard.media

# BigQuery Datasets managed by the project-factory
datasets:
  my_dataset:
    friendly_name: "My Dataset"
    location: "US"
