# yaml-language-server: $schema=../../../../../../schemas/folder.schema.json

name: lon-prod
parent: $folder_ids:naeu-department/lon-team

iam_by_principals:
  $iam_principals:gcp-organization-admins:
    - roles/owner
  $iam_principals:gcp-devops:
    - roles/resourcemanager.folderAdmin
    - roles/resourcemanager.projectCreator
    - roles/viewer
  $iam_principals:gcp-network-admins:
    - roles/compute.networkAdmin
    - roles/viewer
  $iam_principals:gcp-security-admins:
    - roles/iam.securityAdmin
    - roles/resourcemanager.folderViewer
  $iam_principals:gcp-billing-admins:
    - roles/viewer
  $iam_principals:gcp-mediacreators-users:
    - roles/viewer
