# yaml-language-server: $schema=../../../../../schemas/firewall-rules.schema.json

ingress:
  # Allow Secure Admin Access (SSH and RDP) from Google IAP Proxy
  allow-iap-admin-access-newyork:
    description: "Allow SSH (TCP 22) and RDP (TCP 3389) ingress from Identity-Aware Proxy."
    priority: 1000
    source_ranges:
      - $cidr_ranges_sets:iap_forwarders
    rules:
      - protocol: tcp
        ports:
          - 22
          - 3389

  # Default Deny/Logging rule
  deny-unmatched-ingress-newyork:
    description: "Deny and log any unmatched ingress traffic."
    deny: true
    priority: 65535
    enable_logging:
      include_metadata: false
