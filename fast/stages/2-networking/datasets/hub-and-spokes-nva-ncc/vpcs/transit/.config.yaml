# yaml-language-server: $schema=../../../../schemas/vpc.schema.json

# Transit VPC: hosts the NVA nic1 and the transit-side router appliance
# routers, which learn the workload VPC spoke subnets from the transit hub and
# advertise them to the NVAs. Import policies prefer the local instances (b
# active, c standby) for everything, except that regions are ranked (primary
# first) and the workload prefixes of higher ranked regions are demoted, so
# that inter-region east-west flows use the higher ranked region's appliances
# in both directions and fall back to the local ones only when those are gone.
project_id: $project_ids:net-core-0
name: transit
routing_mode: GLOBAL
routers:
  ra-primary:
    region: $locations:primary
    asn: 64515
    interfaces:
      intf-0:
        subnet: $subnets:transit/europe-west1/transit-primary
        ip_address: 10.64.16.252
      intf-1:
        subnet: $subnets:transit/europe-west1/transit-primary
        ip_address: 10.64.16.253
        redundant_interface: intf-0
    route_policies:
      import-b:
        type: IMPORT
        terms:
          - priority: 20
            match:
              expression: "destination.inAnyRange(prefix('0.0.0.0/0').orLonger())"
            actions:
              - expression: med.set(100)
              - expression: accept()
      import-c:
        type: IMPORT
        terms:
          - priority: 20
            match:
              expression: "destination.inAnyRange(prefix('0.0.0.0/0').orLonger())"
            actions:
              - expression: med.set(150)
              - expression: accept()
    peers:
      primary-b-0:
        interface: intf-0
        asn: 64513
        address: $nva_addresses:primary-b-0/transit
        router_appliance_instance: $nva_instances:primary-b-0
        import_policies:
          - import-b
      primary-b-1:
        interface: intf-1
        asn: 64513
        address: $nva_addresses:primary-b-0/transit
        router_appliance_instance: $nva_instances:primary-b-0
        import_policies:
          - import-b
      primary-c-0:
        interface: intf-0
        asn: 64513
        address: $nva_addresses:primary-c-0/transit
        router_appliance_instance: $nva_instances:primary-c-0
        import_policies:
          - import-c
      primary-c-1:
        interface: intf-1
        asn: 64513
        address: $nva_addresses:primary-c-0/transit
        router_appliance_instance: $nva_instances:primary-c-0
        import_policies:
          - import-c
  ra-secondary:
    region: $locations:secondary
    asn: 64515
    interfaces:
      intf-0:
        subnet: $subnets:transit/europe-west8/transit-secondary
        ip_address: 10.64.17.252
      intf-1:
        subnet: $subnets:transit/europe-west8/transit-secondary
        ip_address: 10.64.17.253
        redundant_interface: intf-0
    route_policies:
      import-b:
        type: IMPORT
        terms:
          # workload prefixes of higher ranked regions: their appliances handle
          # inter-region east-west traffic in both directions
          - priority: 10
            match:
              expression: "destination.inAnyRange([prefix('10.65.0.0/24').orLonger(), prefix('10.66.0.0/24').orLonger()])"
            actions:
              - expression: med.set(10100)
              - expression: accept()
          - priority: 20
            match:
              expression: "destination.inAnyRange(prefix('0.0.0.0/0').orLonger())"
            actions:
              - expression: med.set(100)
              - expression: accept()
      import-c:
        type: IMPORT
        terms:
          # workload prefixes of higher ranked regions: their appliances handle
          # inter-region east-west traffic in both directions
          - priority: 10
            match:
              expression: "destination.inAnyRange([prefix('10.65.0.0/24').orLonger(), prefix('10.66.0.0/24').orLonger()])"
            actions:
              - expression: med.set(10150)
              - expression: accept()
          - priority: 20
            match:
              expression: "destination.inAnyRange(prefix('0.0.0.0/0').orLonger())"
            actions:
              - expression: med.set(150)
              - expression: accept()
    peers:
      secondary-b-0:
        interface: intf-0
        asn: 64513
        address: $nva_addresses:secondary-b-0/transit
        router_appliance_instance: $nva_instances:secondary-b-0
        import_policies:
          - import-b
      secondary-b-1:
        interface: intf-1
        asn: 64513
        address: $nva_addresses:secondary-b-0/transit
        router_appliance_instance: $nva_instances:secondary-b-0
        import_policies:
          - import-b
      secondary-c-0:
        interface: intf-0
        asn: 64513
        address: $nva_addresses:secondary-c-0/transit
        router_appliance_instance: $nva_instances:secondary-c-0
        import_policies:
          - import-c
      secondary-c-1:
        interface: intf-1
        asn: 64513
        address: $nva_addresses:secondary-c-0/transit
        router_appliance_instance: $nva_instances:secondary-c-0
        import_policies:
          - import-c
