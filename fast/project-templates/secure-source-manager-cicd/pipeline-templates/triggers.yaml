# Copy to .cloudbuild/triggers.yaml on the repository's default branch.
# Omitting serviceAccount on any entry causes Secure Source Manager to drop
# the entire file silently with no UI banner, status check, or audit log.

triggers:
  - name: pull-request
    # TODO: edit to the build project id
    project: my-dev-build-pool-0
    eventType: pull_request
    configFilePath: .cloudbuild/cloudbuild.yaml
    # TODO: edit to the <repo>/ro build identity id from build_identities output
    serviceAccount: projects/my-dev-build-pool-0/serviceAccounts/test-0-vpcsc-ro@my-dev-build-pool-0.iam.gserviceaccount.com
    substitutions:
      _ACTION: plan
      # TODO: edit to the read-only Terraform service account email
      _TF_SA: iac-vpcsc-ro@my-iac-0.iam.gserviceaccount.com

  - name: main-push
    # TODO: edit to the build project id
    project: my-dev-build-pool-0
    eventType: push
    includedGitRefs: ^main$
    configFilePath: .cloudbuild/cloudbuild.yaml
    # TODO: edit to the <repo>/rw build identity id from build_identities output
    serviceAccount: projects/my-dev-build-pool-0/serviceAccounts/test-0-vpcsc-rw@my-dev-build-pool-0.iam.gserviceaccount.com
    substitutions:
      _ACTION: apply
      # TODO: edit to the read-write Terraform service account email
      _TF_SA: iac-vpcsc-rw@my-iac-0.iam.gserviceaccount.com
