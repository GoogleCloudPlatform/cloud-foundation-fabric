# yaml-language-server: $schema=https://cdn.jsdelivr.net/gh/GoogleCloudPlatform/cloud-foundation-fabric@master/modules/project-factory/schemas/project.schema.json

# TODO: set a parent folder if needed
# parent: $folder_ids:devops
iam_by_principals:
  $iam_principals:service_accounts/_self_/crema-autoscaler-sa:
    - roles/iam.serviceAccountUser
    - roles/logging.logWriter
    - roles/monitoring.metricWriter
    - roles/monitoring.viewer
    - roles/parametermanager.parameterAccessor
    - roles/parametermanager.parameterViewer
    - roles/run.admin
  $iam_principals:service_accounts/_self_/worker-pool-sa:
    - roles/logging.logWriter
services:
  - artifactregistry.googleapis.com
  - cloudbuild.googleapis.com
  - compute.googleapis.com
  - iam.googleapis.com
  - logging.googleapis.com
  - monitoring.googleapis.com
  - parametermanager.googleapis.com
  - run.googleapis.com
  - secretmanager.googleapis.com
  - storage.googleapis.com
service_accounts:
  crema-autoscaler-sa:
    display_name: CREMA autoscaler service account.
  worker-pool-sa:
    display_name: Cloud Run worker pool GitHub runner service account.
