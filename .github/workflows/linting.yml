name: "Linting"
# yamllint disable-line rule:truthy
on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master
  merge_group:
    branches:
      - master

permissions:
  contents: read

jobs:
  linting:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          cache: 'pip'
          cache-dependency-path: 'tools/requirements.txt'

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.12.2

      - uses: terraform-linters/setup-tflint@6ffdbaa3be476b3431f7275c26966ef32ff60337 # v6.3.2
        name: Setup TFLint
        with:
          tflint_version: v0.65.0

      - name: Init TFLint
        run: |
          cp .tflint.hcl ~
          tflint --init
        env:
          # https://github.com/terraform-linters/tflint/blob/master/docs/user-guide/plugins.md#avoiding-rate-limiting
          GITHUB_TOKEN: ${{ github.token }}

      - name: Install dependencies
        run: |
          pip install -r tools/requirements.txt

      - name: Boilerplate
        id: boilerplate
        run: |
          python3 tools/check_boilerplate.py $GITHUB_WORKSPACE

      - name: Terraform Linting Check
        id: fmt
        run: |
          terraform fmt -recursive -check -diff $GITHUB_WORKSPACE

      - name: TFLint Modules
        run: cd modules && tflint --recursive -f compact

      - name: TFLint FAST
        run: |
          python3 tools/tflint-fast.py

      - name: Check documentation
        id: documentation-fabric
        run: |
          python3 tools/check_documentation.py --show-diffs --no-show-summary modules fast

      - name: Check schema docs
        id: schema-docs
        run: |
          python3 tools/check_schema_docs.py --show-diffs --no-show-summary modules fast blueprints

      - name: Check documentation links
        id: documentation-links-fabric
        run: |
          python3 tools/check_links.py --no-show-summary .

      - name: Check name length (fast)
        id: name-length-fast
        run: |
          python3 tools/check_names.py --prefix-length=10 --failed-only fast/stages

      - name: Check YAML schemas
        id: yaml-schema
        run: |
          python3 tools/check_yaml_schema.py modules fast

      - name: Check python formatting
        id: yapf
        uses: pre-commit/action@1b06ec171f2f6faa71ed760c4042bd969e4f8b43
        with:
          extra_args: yapf --all-files

      - name: Check modules versions
        id: versions
        uses: pre-commit/action@1b06ec171f2f6faa71ed760c4042bd969e4f8b43
        with:
          extra_args: versions --all-files

      - name: Check for diverging files
        id: duplicates
        uses: pre-commit/action@1b06ec171f2f6faa71ed760c4042bd969e4f8b43
        with:
          extra_args: duplicate-diff --all-files

      - name: Check YAML files
        id: yaml-lint
        uses: pre-commit/action@1b06ec171f2f6faa71ed760c4042bd969e4f8b43
        with:
          extra_args: yamllint --all-files

      - name: Check for spelling mistakes
        id: codespell
        uses: pre-commit/action@1b06ec171f2f6faa71ed760c4042bd969e4f8b43
        with:
          extra_args: codespell --all-files
