name: "Automated PR Review"
# yamllint disable-line rule:truthy
on:
  pull_request_target: # zizmor: ignore[dangerous-triggers]
    types:
      - opened
      - synchronize
      - labeled

jobs:
  pr-review:
    # Run only if the PR has the 'automated-review' label
    if: contains(github.event.pull_request.labels.*.name, 'automated-review')
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - id: checkout
        name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # Need full history for diffing
          persist-credentials: false

      - id: gcp-auth
        name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          # yamllint disable-line rule:line-length
          workload_identity_provider: ${{ vars.REVIEWS_WIF_PROVIDER }}
          service_account: ${{ vars.REVIEWS_WIF_SA }}
          access_token_lifetime: 900s

      - id: setup-python
        name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'

      - id: install-deps
        name: Install Dependencies
        run: |
          pip install google-genai

      - id: generate-diff
        name: Generate PR Diff
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          # Fetch the pull request head
          git fetch origin pull/$PR_NUMBER/head

          # Generate the diff between the PR base and the PR head
          git diff "$BASE_SHA"..."$HEAD_SHA" > pr.diff

      - id: fetch-comments
        name: Fetch PR Comments
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const comments = await github.rest.issues.listComments({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 20,
              sort: 'created',
              direction: 'desc'
            });
            const fs = require('fs');
            fs.writeFileSync('pr_comments.json', JSON.stringify(comments.data));

      - id: run-review
        name: Run Gemini PR Review
        env:
          VERTEX_PROJECT: ${{ vars.REVIEWS_VERTEX_PROJECT }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          python3 tools/pr_review.py \
            --project "$VERTEX_PROJECT" \
            --diff-file pr.diff \
            --comments-file pr_comments.json \
            --base-sha "$BASE_SHA" \
            --head-sha "$HEAD_SHA" > review_output.md

      - id: pr-comment
        name: Post comment to Pull Request
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('fs');
            const reviewContent = fs.readFileSync('review_output.md', 'utf8');
            const output = `### Automated PR Review 🤖\n*(Reviewed commit: ${context.payload.pull_request.head.sha})*\n\n${reviewContent}`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            })

      - id: remove-label
        name: Remove automated-review label
        if: always()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            try {
              await github.rest.issues.removeLabel({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: 'automated-review'
              });
            } catch (error) {
              console.log('Error removing label', error);
            }
