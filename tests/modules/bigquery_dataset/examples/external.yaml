values:
  module.bigquery-dataset.google_bigquery_dataset.default:
    dataset_id: my_dataset
    location: EU
    project: my-project
  module.bigquery-dataset.google_bigquery_table.default["clicks"]:
    external_data_configuration:
    - autodetect: false
      hive_partitioning_options:
      - mode: CUSTOM
        require_partition_filter: null
        source_uri_prefix: gs://my-bucket/clicks/{dt:DATE}
      source_format: NEWLINE_DELIMITED_JSON
      source_uris:
      - gs://my-bucket/clicks/*
    ignore_auto_generated_schema: true
    schema: '[{"mode":"NULLABLE","name":"payload","type":"STRING"}]'
    table_id: clicks

counts:
  google_bigquery_dataset: 1
  google_bigquery_table: 1
