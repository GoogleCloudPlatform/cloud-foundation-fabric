values:
  google_model_armor_template.default["full"]:
    filter_config:
    - filter_rule_settings: []
      malicious_uri_filter_settings:
      - filter_enforcement: DISABLED
      pi_and_jailbreak_filter_settings:
      - confidence_level: LOW_AND_ABOVE
        filter_enforcement: ENABLED
      rai_settings:
      - rai_filters:
        - confidence_level: LOW_AND_ABOVE
          filter_type: SEXUALLY_EXPLICIT
        - confidence_level: MEDIUM_AND_ABOVE
          filter_type: HATE_SPEECH
        - confidence_level: HIGH
          filter_type: HARASSMENT
        - confidence_level: MEDIUM_AND_ABOVE
          filter_type: DANGEROUS
      sdp_settings:
      - advanced_config:
        - deidentify_template: projects/my-project/locations/eu/deidentifyTemplates/deidentify
          inspect_template: projects/my-project/locations/eu/inspectTemplates/inspect
        basic_config: []
    labels:
      env: test
    location: eu
    project: my-project
    template_id: full
    template_metadata:
