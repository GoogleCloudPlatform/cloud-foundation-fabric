values:
  module.cluster-1.google_container_cluster.cluster:
    location: europe-west1-b
    name: cluster-1

  module.cluster-1.google_gke_backup_backup_plan.backup_plan["backup-1"]:
    backup_config:
    - all_namespaces: null
      encryption_key: []
      include_secrets: true
      include_volume_data: true
      selected_applications:
      - namespaced_names:
        - namespace: namespace-1
          name: app-1
        - namespace: namespace-1
          name: app-2
      selected_namespaces: []
    backup_schedule:
    - cron_schedule: 0 9 * * 1
    location: europe-west2
    name: backup-1
    project: project-id
    retention_policy:
    - locked: false

  module.cluster-1.google_gke_backup_restore_channel.restore_channel["restore-channel-1"]:
    destination_project: projects/my-dr-project
    location: europe-west2
    name: restore-channel-1
    project: project-id

  module.cluster-1.google_gke_backup_restore_plan.restore_plan["restore-1"]:
    location: europe-west2
    name: restore-1
    project: project-id
    restore_config:
    - all_namespaces: true
      cluster_resource_conflict_policy: USE_EXISTING_VERSION
      cluster_resource_restore_scope:
      - all_group_kinds: true
        excluded_group_kinds: []
        no_group_kinds: null
        selected_group_kinds: []
      excluded_namespaces: []
      namespaced_resource_restore_mode: DELETE_AND_RESTORE
      no_namespaces: null
      restore_order: []
      selected_applications: []
      selected_namespaces: []
      transformation_rules: []
      volume_data_restore_policy: RESTORE_VOLUME_DATA_FROM_BACKUP
      volume_data_restore_policy_bindings: []

counts:
  google_container_cluster: 1
  google_gke_backup_backup_plan: 1
  google_gke_backup_restore_channel: 1
  google_gke_backup_restore_plan: 1
