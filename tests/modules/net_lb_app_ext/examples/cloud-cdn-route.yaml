values:
  module.glb-0.google_compute_backend_bucket.default["static"]:
    bucket_name: bucket
    enable_cdn: true
  module.glb-0.google_compute_backend_service.default["default"]:
    enable_cdn: true
    load_balancing_scheme: EXTERNAL_MANAGED
  module.glb-0.google_compute_global_forwarding_rule.default[""]:
    load_balancing_scheme: EXTERNAL_MANAGED
  module.glb-0.google_compute_url_map.default:
    path_matcher:
    - name: pathmap
      path_rule:
      - paths:
        - /static
        - /static/*
        route_action:
        - cache_policy:
          - cache_bypass_request_header_names: null
            cache_key_policy: []
            cache_mode: FORCE_CACHE_ALL
            client_ttl: []
            default_ttl:
            - nanos: null
              seconds: '3600'
            max_ttl: []
            negative_caching: true
            negative_caching_policy:
            - code: 404
              ttl:
              - nanos: null
                seconds: '60'
            request_coalescing: null
            serve_while_stale: []

counts:
  google_compute_backend_bucket: 1
  google_compute_backend_service: 1
  google_compute_global_forwarding_rule: 1
  google_compute_health_check: 1
  google_compute_target_http_proxy: 1
  google_compute_url_map: 1
  modules: 1
  resources: 6

outputs: {}
