values:
  module.addresses.google_compute_network_attachment.default["my-na"]:
    connection_preference: ACCEPT_AUTOMATIC
    name: my-na
    project: project-id
    region: europe-west8
    subnetworks:
    - https://www.googleapis.com/compute/v1/projects/my-project/regions/europe-west8/subnetworks/primary
  module.agent-gateway.google_certificate_manager_trust_config.default[0]:
    allowlisted_certificates:
    - {}
    description: Terraform managed.
    labels: null
    location: europe-west8
    name: my-gateway
    project: project-id
    trust_stores:
    - intermediate_cas: []
      trust_anchors:
      - {}
  module.agent-gateway.google_network_services_agent_connectivity_template.default[0]:
    access_path: AGENT_TO_ANYWHERE
    agent_connectivity_template_id: my-gateway
    description: Terraform managed.
    egress_network_config:
    - dns_peering_config: []
      tls_config:
      - additional_roots: PUBLICLY_TRUSTED_ROOTS
        trust_config: projects/123/locations/europe-west8/trustConfigs/my-gateway
      vpc_egress: PRIVATE_RANGES_ONLY
    labels: null
    location: europe-west8
    project: project-id
  module.agent-gateway.google_network_services_agent_gateway.default:
    agent_connectivity_template: projects/123/locations/europe-west8/agentConnectivityTemplates/my-gateway
