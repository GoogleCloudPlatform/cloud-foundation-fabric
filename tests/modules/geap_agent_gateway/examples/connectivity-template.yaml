    egress_network_config:
    - dns_peering_config:
      - domains:
        - corp.internal.
        target_network: projects/xxx/global/networks/aaa
      vpc_egress: ALL_TRAFFIC
    labels: null
    location: europe-west8
    project: project-id
  module.agent-gateway.google_network_services_agent_gateway.default:
    agent_connectivity_template: projects/123/locations/europe-west8/agentConnectivityTemplates/my-gateway
    description: Terraform managed.
    google_managed:
    - governed_access_path: AGENT_TO_ANYWHERE
    location: europe-west8
    name: my-gateway
    network_config: []
    project: project-id
    registries: null
    self_managed: []
  module.dns.google_dns_managed_zone.dns_managed_zone[0]:
