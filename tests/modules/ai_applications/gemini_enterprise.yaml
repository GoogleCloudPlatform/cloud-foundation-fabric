values:
  google_discovery_engine_acl_config.default[0]:
    idp_config:
    - external_idp_config:
      - workforce_pool_name: locations/global/workforcePools/corp-pool
      idp_type: THIRD_PARTY
    location: us
    project: actual-project-id
  google_discovery_engine_cmek_config.default["us"]:
    cmek_config_id: ge-wif-app
    kms_key: projects/kms-project/locations/us/keyRings/ring/cryptoKeys/key
    location: us
    project: actual-project-id
    set_default: true
  google_discovery_engine_data_connector.default["jira-enterprise"]:
    action_config:
    - action_params:
        auth_type: OAUTH
        instance_uri: https://example.atlassian.net
      create_bap_connection: true
    bap_config:
    - enabled_actions:
      - create_issue
      - add_comment
      supported_connector_modes:
      - ACTIONS
    collection_display_name: Jira Cloud Federated
    collection_id: jira-enterprise-collection
    connector_modes:
    - FEDERATED
    - ACTIONS
    data_source: jira
    destination_configs:
    - destinations:
      - host: example.atlassian.net
        port: 443
      key: url
      params: '{"destination_type":"public"}'
    entities:
    - entity_name: project
    - entity_name: issue
    json_params: null
    kms_key_name: projects/kms-project/locations/us/keyRings/ring/cryptoKeys/key
    location: us
    params:
      auth_type: OAUTH
      client_id: jira-oauth-client-id
      instance_id: 00000000-0000-0000-0000-000000000000
      instance_uri: https://example.atlassian.net
    project: actual-project-id
  google_discovery_engine_data_store.default["knowledge"]:
    content_config: CONTENT_REQUIRED
    create_advanced_site_search: false
    data_store_id: ge-wif-app-knowledge
    kms_key_name: projects/kms-project/locations/us/keyRings/ring/cryptoKeys/key
    location: us
    project: actual-project-id
    solution_types:
    - SOLUTION_TYPE_SEARCH
  google_discovery_engine_search_engine.default[0]:
    app_type: APP_TYPE_INTRANET
    collection_id: default_collection
    common_config:
    - company_name: Example Corp
    data_store_ids:
    - ge-wif-app-knowledge
    display_name: Gemini Enterprise WIF
    engine_id: ge-wif-app
    features:
      model-selector: FEATURE_STATE_ON
      workflow-agents: FEATURE_STATE_ON
    kms_key_name: projects/kms-project/locations/us/keyRings/ring/cryptoKeys/key
    knowledge_graph_config:
    - enable_private_knowledge_graph: true
    location: us
    project: actual-project-id
    search_engine_config:
    - search_add_ons:
      - SEARCH_ADD_ON_LLM
      search_tier: SEARCH_TIER_ENTERPRISE
  google_discovery_engine_search_engine_iam_binding.default["roles/discoveryengine.agentspaceUser"]:
    collection_id: default_collection
    engine_id: ge-wif-app
    location: us
    members:
    - group:workforce-users@example.com
    project: actual-project-id
    role: roles/discoveryengine.agentspaceUser
  google_discovery_engine_user_store.default[0]:
    default_license_config: projects/actual-project-id/locations/us/licenseConfigs/enterprise-sub
    enable_expired_license_auto_update: true
    enable_license_auto_register: true
    location: us
    project: actual-project-id
    user_store_id: default_user_store
  google_discovery_engine_widget_config.default[0]:
    access_settings:
    - enable_web_app: true
      workforce_identity_pool_provider: locations/global/workforcePools/corp-pool/providers/oidc-provider
    collection_id: default_collection
    engine_id: ge-wif-app
    location: us
    project: actual-project-id

counts:
  google_discovery_engine_acl_config: 1
  google_discovery_engine_cmek_config: 1
  google_discovery_engine_data_connector: 1
  google_discovery_engine_data_store: 1
  google_discovery_engine_search_engine: 1
  google_discovery_engine_search_engine_iam_binding: 1
  google_discovery_engine_user_store: 1
