# yaml-language-server: $schema=../../../../schemas/psc-endpoints.schema.json

published_services:
  # 1. Published Service Attachment Endpoint
  psc-reg-fr:
    region: $locations:primary
    subnetwork: $subnets:core/europe-west1/core-default
    target: $service_attachments:my-sa

global_apis:
  # 2. Global Google APIs Endpoint
  pscallapis:
    network: $networks:core
    address: "10.0.0.33"
    target: all-apis
    service_directory_registration:
      region: $locations:primary

regional_apis:
  # 3. Regional Google API Endpoint
  aiplatform-eu:
    network: $networks:core
    region: $locations:primary
    subnetwork: $subnets:core/europe-west1/core-default
    target: aiplatform.eu.rep.googleapis.com
