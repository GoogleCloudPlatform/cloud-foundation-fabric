# skip boilerplate check
---
# start of document (---) avoids errors if the file only contains comments

# yaml-language-server: $schema=../../../../schemas/vpc.schema.json

project_id: $project_ids:net-core-0
name: core-0
delete_default_routes_on_create: true
nat_config:
  nat-static:
    region: $locations:primary
    num_nat_ips: 3
    config_source_subnetworks:
      all: false
      subnetworks:
        - self_link: $subnets:core/europe-west1/core-default
  nat-private:
    region: $locations:primary
    type: PRIVATE
    router_name: custom-private-nat-router
    config_source_subnetworks:
      all: false
      subnetworks:
        - self_link: $subnets:core/europe-west1/core-default
    rules:
      - description: private nat hybrid rule
        rule_number: 100
        match: nexthop.is_hybrid
        source_ranges:
          - $subnets:core/europe-west1/core-private-nat
