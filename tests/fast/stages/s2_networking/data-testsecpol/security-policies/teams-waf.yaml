# yaml-language-server: $schema=../../../../../../fast/stages/2-networking/schemas/security-policy.schema.json

name: teams-waf
parent_id:
  folder_id: $folder_ids:teams
attachments:
  teams:
    id: $folder_ids:teams
    excluded_projects:
      - projects/2222222222
rules:
  sqli:
    priority: 1000
    action: deny(403)
    preview: true
    match:
      expression: evaluatePreconfiguredWaf('sqli-v33-stable')
  legacy:
    priority: 2000
    action: redirect
    match:
      expression: request.path.startsWith('/legacy/')
    redirect_options:
      type: EXTERNAL_302
      target: https://www.example.com/
