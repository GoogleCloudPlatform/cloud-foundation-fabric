      user-data: "#cloud-config\n\n# NVA startup for the NCC router appliance mode:\
        \ static per-NIC routes and\n# optional masquerade as in the ILB sandwich\
        \ template, plus a containerized FRR\n# instance peering via eBGP with the\
        \ Cloud Router interfaces of every VPC the\n# NVA is attached to. The FRR\
        \ configuration is rendered by the factory into the\n# `nva-frr-config` metadata\
        \ key and reloaded whenever it changes.\n\nwrite_files:\n  - path: /etc/frr/daemons\n\
        \    permissions: \"0644\"\n    content: |\n      bgpd=yes\n      zebra=yes\n\
        \      vtysh_enable=yes\n      zebra_options=\"  -A 127.0.0.1 -s 90000000\"\
        \n      bgpd_options=\"   -A 127.0.0.1\"\n  - path: /etc/frr/vtysh.conf\n\
        \    permissions: \"0644\"\n    content: |\n      service integrated-vtysh-config\n\
        \  - path: /var/run/nva/frr-config-sync.sh\n    permissions: \"0755\"\n  \
        \  content: |\n      #!/bin/bash\n      # Fetch the FRR configuration from\
        \ instance metadata, substitute the\n      # router id with the primary NIC\
        \ address and (re)start FRR when the\n      # configuration changes. Runs\
        \ forever in the background.\n      METADATA_URL=\"http://metadata.google.internal/computeMetadata/v1/instance\"\
        \n      METADATA_HEADER=\"Metadata-Flavor: Google\"\n      IP0=$(curl -s -H\
        \ \"${METADATA_HEADER}\" \"${METADATA_URL}/network-interfaces/0/ip\")\n  \
        \    LAST_HASH=\"\"\n      while true; do\n        CONFIG=$(curl -s -f -H\
        \ \"${METADATA_HEADER}\" \"${METADATA_URL}/attributes/nva-frr-config\")\n\
        \        if [ -n \"${CONFIG}\" ]; then\n          HASH=$(echo \"${CONFIG}\"\
        \ | md5sum | cut -d' ' -f1)\n          if [ \"${HASH}\" != \"${LAST_HASH}\"\
        \ ]; then\n            echo \"FRR configuration changed, applying.\"\n   \
        \         echo \"${CONFIG}\" | sed \"s/ROUTER_ID/${IP0}/\" > /etc/frr/frr.conf\n\
        \            chown -R 100:101 /etc/frr || true\n            # pull only when\
        \ the image is not already cached locally; on first\n            # boot the\
        \ pull may race with Cloud NAT becoming available\n            if ! docker\
        \ image inspect quay.io/frrouting/frr:10.2.1 >/dev/null 2>&1; then\n     \
        \         for i in $(seq 1 30); do\n                docker pull quay.io/frrouting/frr:10.2.1\
        \ && break\n                echo \"Image pull failed, retrying in 10s (${i}/30).\"\
        \n                sleep 10\n              done\n            fi\n         \
        \   docker rm -f frr 2>/dev/null || true\n            docker run -d --name\
        \ frr --restart=always --net=host \\\n              --cap-add=NET_ADMIN --cap-add=NET_RAW\
        \ --cap-add=NET_BIND_SERVICE \\\n              --cap-add=SYS_ADMIN -v /etc/frr:/etc/frr\
        \ quay.io/frrouting/frr:10.2.1 && \\\n              LAST_HASH=\"${HASH}\"\n\
        \          fi\n        fi\n        sleep 30\n      done\n\nruncmd:\n  - |\n\
        \    #!/bin/bash\n    set -ex\n\n    echo \"Starting NVA network configuration...\"\
        \n\n    echo \"Enabling IP forwarding and loose reverse path filtering.\"\n\
        \    cat > /etc/sysctl.d/90-nva.conf <<EOF\n    net.ipv4.ip_forward = 1\n\
        \    net.ipv4.conf.all.rp_filter = 2\n    net.ipv4.conf.default.rp_filter\
        \ = 2\n    EOF\n    sysctl -p /etc/sysctl.d/90-nva.conf\n\n    iptables -I\
        \ FORWARD -j ACCEPT\n    # let Cloud Router initiated BGP sessions in through\
        \ the host firewall\n    iptables -I INPUT -p tcp --dport 179 -j ACCEPT\n\n\
        \    METADATA_URL=\"http://metadata.google.internal/computeMetadata/v1/instance/network-interfaces\"\
        \n    METADATA_HEADER=\"Metadata-Flavor: Google\"\n    INTERFACE_INDEXES=$(curl\
        \ -s -H \"${METADATA_HEADER}\" \"${METADATA_URL}/\" | sed 's:/$::')\n\n  \
        \  for i in ${INTERFACE_INDEXES}; do\n      IF_NAME=\"eth${i}\"\n      echo\
        \ \"Configuring interface ${IF_NAME}...\"\n\n      GATEWAY=$(curl -s -H \"\
        ${METADATA_HEADER}\" \"${METADATA_URL}/${i}/gateway\")\n      if [ -z \"${GATEWAY}\"\
        \ ]; then\n        echo \"Could not retrieve gateway for ${IF_NAME}. Skipping.\"\
        \n        continue\n      fi\n      echo \"Gateway for ${IF_NAME} is ${GATEWAY}.\"\
        \n      # loose rp_filter per interface (sysctl \"all\" is a max with per-if)\n\
        \      sysctl -w net.ipv4.conf.${IF_NAME}.rp_filter=2 || true\n\n        \
        \          if [ \"${i}\" == \"0\" ]; then\n                        echo \"\
        Enabling NAT (Masquerade) on ${IF_NAME} and setting default route.\"\n   \
        \     ip route replace default via ${GATEWAY} dev ${IF_NAME}\n           \
        \     # keep source addresses for traffic that stays private, so that an\n\
        \        # active/standby switch does not reset flows through the NAT\n  \
        \      iptables -t nat -A POSTROUTING -o ${IF_NAME} -d 10.0.0.0/8 -j RETURN\n\
        \                # keep source addresses for traffic that stays private, so\
        \ that an\n        # active/standby switch does not reset flows through the\
        \ NAT\n        iptables -t nat -A POSTROUTING -o ${IF_NAME} -d 172.16.0.0/12\
        \ -j RETURN\n                # keep source addresses for traffic that stays\
        \ private, so that an\n        # active/standby switch does not reset flows\
        \ through the NAT\n        iptables -t nat -A POSTROUTING -o ${IF_NAME} -d\
        \ 192.168.0.0/16 -j RETURN\n                # keep source addresses for traffic\
        \ that stays private, so that an\n        # active/standby switch does not\
        \ reset flows through the NAT\n        iptables -t nat -A POSTROUTING -o ${IF_NAME}\
        \ -d 100.64.0.0/10 -j RETURN\n                iptables -t nat -A POSTROUTING\
        \ -o ${IF_NAME} -j MASQUERADE\n              fi\n                        if\
        \ [ \"${i}\" == \"1\" ]; then\n                        echo \"Adding route\
        \ for 10.65.0.0/16 via ${GATEWAY} on ${IF_NAME}\"\n        ip route add 10.65.0.0/16\
        \ via ${GATEWAY} dev ${IF_NAME} proto static\n                echo \"Adding\
        \ route for 10.66.0.0/16 via ${GATEWAY} on ${IF_NAME}\"\n        ip route\
        \ add 10.66.0.0/16 via ${GATEWAY} dev ${IF_NAME} proto static\n          \
        \                    fi\n                done\n\n    echo \"Starting FRR configuration\
        \ sync.\"\n    nohup /var/run/nva/frr-config-sync.sh >> /var/log/nva-frr-sync.log\
        \ 2>&1 &\n\n    echo \"NVA network configuration complete.\"\n"
