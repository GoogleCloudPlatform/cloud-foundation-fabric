        \ informational\nip forwarding\n!\n! routes learned on this NIC are tagged\
        \ so that they are not sent back to it\nbgp community-list standard CL-NIC0-LEARNED\
        \ seq 5 permit 64513:100\nip prefix-list PL-NIC1-DENY seq 5 permit 0.0.0.0/0\n\
        ! routes learned on this NIC are tagged so that they are not sent back to\
        \ it\nbgp community-list standard CL-NIC1-LEARNED seq 5 permit 64513:101\n\
        !\nroute-map RM-NIC0-IN permit 20\n set community 64513:100 additive\n!\n\
        route-map RM-NIC0-OUT deny 20\n match community CL-NIC0-LEARNED\n!\nroute-map\
        \ RM-NIC0-OUT permit 100\n!\nroute-map RM-NIC1-IN deny 10\n match ip address\
        \ prefix-list PL-NIC1-DENY\n!\nroute-map RM-NIC1-IN permit 20\n set community\
        \ 64513:101 additive\n!\nroute-map RM-NIC1-OUT deny 20\n match community CL-NIC1-LEARNED\n\
        !\nroute-map RM-NIC1-OUT permit 100\n!\nrouter bgp 64513\n bgp router-id ROUTER_ID\n\
        \ bgp log-neighbor-changes\n no bgp ebgp-requires-policy\n no bgp network\
        \ import-check\n bgp bestpath as-path multipath-relax\n timers bgp 3 9\n !\
        \ GCE assigns /32 addresses, so Cloud Router interfaces are reached via the\n\
        \ ! subnet gateway and fail FRR's eBGP connected check\n neighbor 10.64.0.252\
        \ remote-as 64512\n neighbor 10.64.0.252 description routing-ra-primary\n\
        \ neighbor 10.64.0.252 update-source eth0\n neighbor 10.64.0.252 disable-connected-check\n\
        \ neighbor 10.64.0.253 remote-as 64512\n neighbor 10.64.0.253 description\
        \ routing-ra-primary\n neighbor 10.64.0.253 update-source eth0\n neighbor\
        \ 10.64.0.253 disable-connected-check\n neighbor 10.64.16.252 remote-as 64515\n\
        \ neighbor 10.64.16.252 description transit-ra-primary\n neighbor 10.64.16.252\
        \ update-source eth1\n neighbor 10.64.16.252 disable-connected-check\n neighbor\
        \ 10.64.16.253 remote-as 64515\n neighbor 10.64.16.253 description transit-ra-primary\n\
        \ neighbor 10.64.16.253 update-source eth1\n neighbor 10.64.16.253 disable-connected-check\n\
        \ !\n address-family ipv4 unicast\n  ! originated toward every neighbor; the\
        \ kernel route comes from the NIC\n  ! `routes` (static via the subnet gateway),\
        \ not from BGP\n  network 10.65.0.0/24\n  ! originated toward every neighbor;\
        \ the kernel route comes from the NIC\n  ! `routes` (static via the subnet\
        \ gateway), not from BGP\n  network 10.66.0.0/24\n  ! originated toward every\
        \ neighbor; the kernel route comes from the NIC\n  ! `routes` (static via\
        \ the subnet gateway), not from BGP\n  network 10.65.1.0/24\n  ! originated\
        \ toward every neighbor; the kernel route comes from the NIC\n  ! `routes`\
        \ (static via the subnet gateway), not from BGP\n  network 10.66.1.0/24\n\
        \  neighbor 10.64.0.252 soft-reconfiguration inbound\n  ! MED neutral: FRR\
        \ strips the MED toward eBGP peers by default, pass the\n  ! Cloud Router\
        \ value through instead; priorities are set by Cloud Router\n  ! import policies\n\
        \  neighbor 10.64.0.252 attribute-unchanged med\n  neighbor 10.64.0.252 route-map\
        \ RM-NIC0-IN in\n  neighbor 10.64.0.252 route-map RM-NIC0-OUT out\n  neighbor\
        \ 10.64.0.253 soft-reconfiguration inbound\n  ! MED neutral: FRR strips the\
        \ MED toward eBGP peers by default, pass the\n  ! Cloud Router value through\
        \ instead; priorities are set by Cloud Router\n  ! import policies\n  neighbor\
        \ 10.64.0.253 attribute-unchanged med\n  neighbor 10.64.0.253 route-map RM-NIC0-IN\
