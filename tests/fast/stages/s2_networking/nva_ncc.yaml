        \ soft-reconfiguration inbound\n  ! MED neutral: FRR strips the MED toward\
        \ eBGP peers by default, pass the\n  ! Cloud Router value through instead;\
        \ priorities are set by Cloud Router\n  ! import policies\n  neighbor 10.64.16.252\
        \ attribute-unchanged med\n  neighbor 10.64.16.252 route-map RM-NIC1-IN in\n\
        \  neighbor 10.64.16.252 route-map RM-NIC1-OUT out\n  neighbor 10.64.16.253\
        \ soft-reconfiguration inbound\n  ! MED neutral: FRR strips the MED toward\
        \ eBGP peers by default, pass the\n  ! Cloud Router value through instead;\
        \ priorities are set by Cloud Router\n  ! import policies\n  neighbor 10.64.16.253\
        \ attribute-unchanged med\n  neighbor 10.64.16.253 route-map RM-NIC1-IN in\n\
        \  neighbor 10.64.16.253 route-map RM-NIC1-OUT out\n exit-address-family\n\
