    hostname: null
    instance_encryption_key: []
    key_revocation_action_type: null
    labels: null
    machine_type: e2-standard-2
    metadata:
      google-logging-enabled: 'true'
      nva-frr-config: "frr defaults traditional\nhostname nva-managed-b-0\nlog stdout\
        \ informational\nip forwarding\n!\n! routes learned on this NIC are tagged\
        \ so that they are not sent back to it\nbgp community-list standard CL-NIC0-LEARNED\
        \ seq 5 permit 64514:100\nip prefix-list PL-NIC1-DENY seq 5 permit 0.0.0.0/0\n\
        ! routes learned on this NIC are tagged so that they are not sent back to\
        \ it\nbgp community-list standard CL-NIC1-LEARNED seq 5 permit 64514:101\n\
        !\nroute-map RM-NIC0-IN permit 20\n set community 64514:100 additive\n!\n\
        route-map RM-NIC0-OUT deny 20\n match community CL-NIC0-LEARNED\n!\nroute-map\
        \ RM-NIC0-OUT permit 100\n!\nroute-map RM-NIC1-IN deny 10\n match ip address\
        \ prefix-list PL-NIC1-DENY\n!\nroute-map RM-NIC1-IN permit 20\n set community\
        \ 64514:101 additive\n!\nroute-map RM-NIC1-OUT deny 20\n match community CL-NIC1-LEARNED\n\
        !\nroute-map RM-NIC1-OUT permit 100\n!\nrouter bgp 64514\n bgp router-id ROUTER_ID\n\
        \ bgp log-neighbor-changes\n no bgp ebgp-requires-policy\n no bgp network\
        \ import-check\n bgp bestpath as-path multipath-relax\n timers bgp 3 9\n !\
        \ GCE assigns /32 addresses, so Cloud Router interfaces are reached via the\n\
        \ ! subnet gateway and fail FRR's eBGP connected check\n neighbor 10.0.1.252\
        \ remote-as 64515\n neighbor 10.0.1.252 description trusted-ra\n neighbor\
        \ 10.0.1.252 update-source eth1\n neighbor 10.0.1.252 disable-connected-check\n\
        \ neighbor 10.0.0.252 remote-as 64512\n neighbor 10.0.0.252 description untrusted-ra\n\
        \ neighbor 10.0.0.252 update-source eth0\n neighbor 10.0.0.252 disable-connected-check\n\
        \ neighbor 10.0.0.253 remote-as 64512\n neighbor 10.0.0.253 description untrusted-ra\n\
        \ neighbor 10.0.0.253 update-source eth0\n neighbor 10.0.0.253 disable-connected-check\n\
        \ !\n address-family ipv4 unicast\n  ! originated toward every neighbor; the\
        \ kernel route comes from the NIC\n  ! `routes` (static via the subnet gateway),\
        \ not from BGP\n  network 10.128.0.0/9\n  neighbor 10.0.1.252 soft-reconfiguration\
        \ inbound\n  ! MED neutral: FRR strips the MED toward eBGP peers by default,\
        \ pass the\n  ! Cloud Router value through instead; priorities are set by\
        \ Cloud Router\n  ! import policies\n  neighbor 10.0.1.252 attribute-unchanged\
        \ med\n  neighbor 10.0.1.252 route-map RM-NIC1-IN in\n  neighbor 10.0.1.252\
        \ route-map RM-NIC1-OUT out\n  neighbor 10.0.0.252 soft-reconfiguration inbound\n\
        \  ! MED neutral: FRR strips the MED toward eBGP peers by default, pass the\n\
        \  ! Cloud Router value through instead; priorities are set by Cloud Router\n\
        \  ! import policies\n  neighbor 10.0.0.252 attribute-unchanged med\n  neighbor\
        \ 10.0.0.252 route-map RM-NIC0-IN in\n  neighbor 10.0.0.252 route-map RM-NIC0-OUT\
        \ out\n  neighbor 10.0.0.253 soft-reconfiguration inbound\n  ! MED neutral:\
        \ FRR strips the MED toward eBGP peers by default, pass the\n  ! Cloud Router\
        \ value through instead; priorities are set by Cloud Router\n  ! import policies\n\
        \  neighbor 10.0.0.253 attribute-unchanged med\n  neighbor 10.0.0.253 route-map\
        \ RM-NIC0-IN in\n  neighbor 10.0.0.253 route-map RM-NIC0-OUT out\n exit-address-family\n\
        !\nline vty\n!\n"
      user-data: "#cloud-config\n\n# NVA startup for the NCC router appliance mode:\
        \ static per-NIC routes and\n# optional masquerade as in the ILB sandwich\
        \ template, plus a containerized FRR\n# instance peering via eBGP with the\
        \ Cloud Router interfaces of every VPC the\n# NVA is attached to. The FRR\
        \ configuration is rendered by the factory into the\n# `nva-frr-config` metadata\
        \ key and reloaded whenever it changes.\n\nwrite_files:\n  - path: /etc/frr/daemons\n\
        \    permissions: \"0644\"\n    content: |\n      bgpd=yes\n      zebra=yes\n\
        \      vtysh_enable=yes\n      zebra_options=\"  -A 127.0.0.1 -s 90000000\"\
        \n      bgpd_options=\"   -A 127.0.0.1\"\n  - path: /etc/frr/vtysh.conf\n\
        \    permissions: \"0644\"\n    content: |\n      service integrated-vtysh-config\n\
        \  - path: /var/run/nva/update-pbrs.sh\n    permissions: \"0755\"\n    content:\
        \ |\n      #!/bin/bash\n      # Continuous update of PBRs for an interface\
        \ (needed when an NVA mixes\n      # NCC Router Appliance spokes on some NICs\
        \ with ILB backends on others).\n      set -e\n\n      IF_INDEX=$1\n     \
        \ METADATA_URL=\"http://metadata.google.internal/computeMetadata/v1/instance/network-interfaces\"\
        \n      METADATA_HEADER=\"Metadata-Flavor: Google\"\n      IF_NAME=\"eth${IF_INDEX}\"\
        \n      TABLE_ID=$((110 + IF_INDEX))\n\n      GATEWAY=$(curl -s -H \"${METADATA_HEADER}\"\
        \ \"${METADATA_URL}/${IF_INDEX}/gateway\")\n      NIC_IP=$(curl -s -H \"${METADATA_HEADER}\"\
        \ \"${METADATA_URL}/${IF_INDEX}/ip\")\n      if [ -z \"${GATEWAY}\" ]; then\n\
        \        echo \"Could not retrieve gateway. Exiting.\"\n        exit 1\n \
        \     fi\n\n      while true; do\n        ip route replace default via ${GATEWAY}\
        \ dev ${IF_NAME} onlink table ${TABLE_ID} || true\n        FORWARDED_IPS_LIST=()\n\
        \        if [ -n \"${NIC_IP}\" ]; then\n          FORWARDED_IPS_LIST+=(\"\
        ${NIC_IP}\")\n        fi\n        FORWARDED_IP_IDS=$(curl -s -H \"${METADATA_HEADER}\"\
        \ \"${METADATA_URL}/${IF_INDEX}/forwarded-ips/\")\n        for ID in ${FORWARDED_IP_IDS};\
        \ do\n          IP=$(curl -s -H \"${METADATA_HEADER}\" \"${METADATA_URL}/${IF_INDEX}/forwarded-ips/${ID}\"\
        )\n          FORWARDED_IPS_LIST+=(\"${IP}\")\n        done\n        FORWARDED_IPS=$(printf\
        \ \"%s\\n\" \"${FORWARDED_IPS_LIST[@]}\")\n\n        CURRENT_RULE_IPS=$(ip\
        \ rule show | grep \"lookup ${TABLE_ID}\" | awk -F 'from ' '/from/ {split($2,\
        \ a, \" \"); print a[1]}' | sort -u || true)\n\n        for IP in ${FORWARDED_IPS};\
        \ do\n          if ! echo \"${CURRENT_RULE_IPS}\" | grep -q \"^${IP}$\"; then\n\
        \            ip rule add from ${IP} to 35.191.0.0/16 lookup ${TABLE_ID}\n\
        \            ip rule add from ${IP} to 130.211.0.0/22 lookup ${TABLE_ID}\n\
        \          fi\n        done\n\n        for IP in ${CURRENT_RULE_IPS}; do\n\
        \          if ! echo \"${FORWARDED_IPS}\" | grep -q \"^${IP}$\"; then\n  \
        \          ip rule del from ${IP} to 35.191.0.0/16 lookup ${TABLE_ID} || true\n\
        \            ip rule del from ${IP} to 130.211.0.0/22 lookup ${TABLE_ID} ||\
        \ true\n          fi\n        done\n\n        sleep 5\n      done\n  - path:\
        \ /var/run/nva/frr-config-sync.sh\n    permissions: \"0755\"\n    content:\
        \ |\n      #!/bin/bash\n      # Fetch the FRR configuration from instance\
        \ metadata, substitute the\n      # router id with the primary NIC address\
        \ and (re)start FRR when the\n      # configuration changes. Runs forever\
        \ in the background.\n      METADATA_URL=\"http://metadata.google.internal/computeMetadata/v1/instance\"\
        \n      METADATA_HEADER=\"Metadata-Flavor: Google\"\n      IP0=$(curl -s -H\
        \ \"${METADATA_HEADER}\" \"${METADATA_URL}/network-interfaces/0/ip\")\n  \
        \    LAST_HASH=\"\"\n      while true; do\n        CONFIG=$(curl -s -f -H\
        \ \"${METADATA_HEADER}\" \"${METADATA_URL}/attributes/nva-frr-config\")\n\
        \        if [ -n \"${CONFIG}\" ]; then\n          HASH=$(echo \"${CONFIG}\"\
        \ | md5sum | cut -d' ' -f1)\n          if [ \"${HASH}\" != \"${LAST_HASH}\"\
        \ ]; then\n            echo \"FRR configuration changed, applying.\"\n   \
        \         echo \"${CONFIG}\" | sed \"s/ROUTER_ID/${IP0}/\" > /etc/frr/frr.conf\n\
        \            chown -R 100:101 /etc/frr || true\n            # pull only when\
        \ the image is not already cached locally; on first\n            # boot the\
        \ pull may race with Cloud NAT becoming available\n            if ! docker\
        \ image inspect quay.io/frrouting/frr:10.2.1 >/dev/null 2>&1; then\n     \
        \         for i in $(seq 1 30); do\n                docker pull quay.io/frrouting/frr:10.2.1\
        \ && break\n                echo \"Image pull failed, retrying in 10s (${i}/30).\"\
        \n                sleep 10\n              done\n            fi\n         \
        \   docker rm -f frr 2>/dev/null || true\n            docker run -d --name\
        \ frr --restart=always --net=host \\\n              --cap-add=NET_ADMIN --cap-add=NET_RAW\
        \ --cap-add=NET_BIND_SERVICE \\\n              --cap-add=SYS_ADMIN -v /etc/frr:/etc/frr\
        \ quay.io/frrouting/frr:10.2.1 && \\\n              LAST_HASH=\"${HASH}\"\n\
        \          fi\n        fi\n        sleep 30\n      done\n\nruncmd:\n  - |\n\
        \    #!/bin/bash\n    set -ex\n\n    echo \"Starting NVA network configuration...\"\
        \n\n    echo \"Enabling IP forwarding and loose reverse path filtering.\"\n\
        \    cat > /etc/sysctl.d/90-nva.conf <<EOF\n    net.ipv4.ip_forward = 1\n\
        \    net.ipv4.conf.all.rp_filter = 2\n    net.ipv4.conf.default.rp_filter\
        \ = 2\n    EOF\n    sysctl -p /etc/sysctl.d/90-nva.conf\n\n    iptables -I\
        \ FORWARD -j ACCEPT\n    # let Cloud Router initiated BGP sessions and ILB\
        \ health checks in through\n    # the host firewall\n    iptables -I INPUT\
        \ -p tcp --dport 179 -j ACCEPT\n    iptables -I INPUT -s 35.191.0.0/16,130.211.0.0/22\
        \ -j ACCEPT\n\n    METADATA_URL=\"http://metadata.google.internal/computeMetadata/v1/instance/network-interfaces\"\
        \n    METADATA_HEADER=\"Metadata-Flavor: Google\"\n    INTERFACE_INDEXES=$(curl\
        \ -s -H \"${METADATA_HEADER}\" \"${METADATA_URL}/\" | sed 's:/$::')\n\n  \
        \  for i in ${INTERFACE_INDEXES}; do\n      IF_NAME=\"eth${i}\"\n      echo\
        \ \"Configuring interface ${IF_NAME}...\"\n\n      GATEWAY=$(curl -s -H \"\
        ${METADATA_HEADER}\" \"${METADATA_URL}/${i}/gateway\")\n      if [ -z \"${GATEWAY}\"\
        \ ]; then\n        echo \"Could not retrieve gateway for ${IF_NAME}. Skipping.\"\
        \n        continue\n      fi\n      echo \"Gateway for ${IF_NAME} is ${GATEWAY}.\"\
        \n      # loose rp_filter per interface (sysctl \"all\" is a max with per-if)\n\
        \      sysctl -w net.ipv4.conf.${IF_NAME}.rp_filter=2 || true\n\n        \
        \          if [ \"${i}\" == \"0\" ]; then\n                        echo \"\
        Enabling NAT (Masquerade) on ${IF_NAME} and setting default route.\"\n   \
        \     ip route replace default via ${GATEWAY} dev ${IF_NAME}\n           \
        \     # keep source addresses for traffic that stays private, so that an\n\
        \        # active/standby switch does not reset flows through the NAT\n  \
        \      iptables -t nat -A POSTROUTING -o ${IF_NAME} -d 10.0.0.0/8 -j RETURN\n\
        \                iptables -t nat -A POSTROUTING -o ${IF_NAME} -j MASQUERADE\n\
        \              fi\n                        \n      echo \"Starting continuous\
        \ PBR update for eth${i} in the background.\"\n      nohup bash /var/run/nva/update-pbrs.sh\
        \ $i >> /var/log/nva-pbr-update.log 2>&1 &\n    done\n\n    echo \"Starting\
        \ FRR configuration sync.\"\n    nohup bash /var/run/nva/frr-config-sync.sh\
        \ >> /var/log/nva-frr-sync.log 2>&1 &\n\n    echo \"NVA network configuration\
        \ complete.\"\n"
