project_id: $project_ids:net-core-0
name: trusted
routing_mode: GLOBAL
routers:
  ra:
    region: $locations:primary
    asn: 64515
    interfaces:
      intf-0:
        subnet: $subnets:trusted/europe-west1/trusted-default
        ip_address: 10.0.1.252
      intf-1:
        subnet: $subnets:trusted/europe-west1/trusted-default
        ip_address: 10.0.1.253
        redundant_interface: intf-0
    peers:
      fw-0:
        interface: intf-0
        asn: 64513
        nva: byo
      managed-0:
        interface: intf-0
        asn: 64514
        nva: managed
