project_id: $project_ids:net-core-0
name: managed
region: $locations:primary
auto_instance_config:
  instance_type: e2-standard-2
  nics:
    - network: $networks:untrusted
      subnet: $subnets:untrusted/europe-west1/untrusted-default
      masquerade: true
      masquerade_exclude: [10.0.0.0/8]
      advertise: ["10.128.0.0/9"]
    - network: $networks:trusted
      subnet: $subnets:trusted/europe-west1/trusted-default
      bgp_inbound_deny: ["0.0.0.0/0"]
instance_groups:
  b:
    auto_create_instances: 1
ncc_ra_config:
  spokes:
    - network: $networks:untrusted
      hub: $ncc_hubs:hub
    - network: $networks:trusted
      hub: $ncc_hubs:hub
bgp_config:
  asn: 64514
  keepalive: 3
  holdtime: 9
