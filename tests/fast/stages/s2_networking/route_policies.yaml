values:
  google_compute_router_route_policy.default["hub/hybrid-connectivity-router/export-med"]:
    name: export-med-05a4ba7f
    project: fast-prod-net-core-0
    region: europe-west1
    router: hub-hybrid-connectivity-router
    terms:
    - actions:
      - description: null
        expression: med.set(1000)
        location: null
        title: null
      - description: null
        expression: accept()
        location: null
        title: null
      match:
      - description: null
        expression: destination == '10.0.0.0/24'
        location: null
        title: null
      priority: 0
    type: ROUTE_POLICY_TYPE_EXPORT
  google_compute_router_route_policy.default["hub/hybrid-connectivity-router/import-drop-all"]:
    name: import-drop-all-29e697e2
    project: fast-prod-net-core-0
    region: europe-west1
    router: hub-hybrid-connectivity-router
    terms:
    - actions:
      - description: null
        expression: drop()
        location: null
        title: null
      match:
      - description: Drop all the routes not accepted above.
        expression: destination.inAnyRange(prefix('0.0.0.0/0').orLonger())
        location: null
        title: default-drop
      priority: 2
    type: ROUTE_POLICY_TYPE_IMPORT
  google_compute_router_route_policy.default["hub/hybrid-connectivity-router/import-rfc1918"]:
    name: import-rfc1918-be8b0a43
    project: fast-prod-net-core-0
    region: europe-west1
    router: hub-hybrid-connectivity-router
    terms:
    - actions:
      - description: null
        expression: accept()
        location: null
        title: null
      match:
      - description: Accept the 3 RFC1918 ranges.
        expression: destination == '10.0.0.0/8' || destination == '172.16.0.0/12'
          || destination == '192.168.0.0/16'
        location: null
        title: import-rfc1918-subnets
      priority: 1
    type: ROUTE_POLICY_TYPE_IMPORT
  # both consumers resolve policy keys to the same generated names
  module.vlan-attachments["hub-onprem-0"].google_compute_router_peer.default[0]:
    export_policies:
    - export-med-05a4ba7f
    import_policies:
    - import-rfc1918-be8b0a43
    - import-drop-all-29e697e2
    router: hub-hybrid-connectivity-router
  module.vpn-ha["hub/to-onprem"].google_compute_router_peer.bgp_peer["remote-0"]:
    export_policies:
    - export-med-05a4ba7f
    import_policies:
    - import-rfc1918-be8b0a43
    - import-drop-all-29e697e2
    router: hub-hybrid-connectivity-router
  module.vpn-ha["hub/to-onprem"].google_compute_router_peer.bgp_peer["remote-1"]:
    export_policies:
    - export-med-05a4ba7f
    import_policies:
    - import-rfc1918-be8b0a43
    - import-drop-all-29e697e2
    router: hub-hybrid-connectivity-router

