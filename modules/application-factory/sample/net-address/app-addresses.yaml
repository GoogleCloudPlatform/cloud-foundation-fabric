# Reserved addresses for the application load balancers.
# Address names are used as keys in the addresses context.

project_id: $project_ids:app-project
internal_addresses:
  app-lb:
    region: $locations:primary
    subnetwork: $subnets:app-subnet
    address: 10.0.0.10
  app-http-lb:
    region: $locations:primary
    subnetwork: $subnets:app-subnet
    address: 10.0.0.11
