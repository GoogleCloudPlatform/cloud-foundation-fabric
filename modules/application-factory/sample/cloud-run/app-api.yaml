# yaml-language-server: $schema=../../schemas/cloud-run.schema.json

# Cloud Run service for the application API.

project_id: $project_ids:app-project
region: $locations:primary
labels:
  environment: dev
containers:
  api:
    image: europe-west1-docker.pkg.dev/my-app-prj/app-docker/api:latest
    ports:
      http1:
        container_port: 8080
    env:
      DB_NAME: app
    env_from_key:
      DB_PASSWORD:
        secret: db-password
        version: latest
service_account_config:
  create: false
  email: $iam_principals:service_accounts/app-sa
revision:
  vpc_access:
    subnet: $subnets:app-subnet
    egress: PRIVATE_RANGES_ONLY
service_config:
  ingress: INGRESS_TRAFFIC_INTERNAL_ONLY
iam:
  roles/run.invoker:
    - $iam_principals:service_accounts/ci-sa
